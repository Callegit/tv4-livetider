<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV4 Livetider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f6; color: #1c2841; }
  #gate { display: flex; align-items: center; justify-content: center; height: 100vh; background: linear-gradient(135deg, #1c2841 0%, #2a3a5c 100%); }
  #gate .card { background: #fff; padding: 40px 36px; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 360px; text-align: center; }
  #gate .logo { background: #c8102e; color: #fff; font-weight: 800; font-size: 18px; padding: 6px 14px; border-radius: 4px; letter-spacing: 1px; display: inline-block; margin-bottom: 20px; }
  #gate h1 { font-size: 22px; margin-bottom: 8px; color: #1c2841; }
  #gate p { font-size: 13px; color: #647a9c; margin-bottom: 24px; }
  #gate input { width: 100%; padding: 12px 16px; border: 2px solid #c8d2e6; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border 0.2s, box-shadow 0.2s; }
  #gate input:focus { border-color: #c8102e; box-shadow: 0 0 0 3px rgba(200,16,46,0.15); }
  #gate button { width: 100%; margin-top: 14px; padding: 12px; background: #c8102e; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; font-family: inherit; letter-spacing: 0.3px; }
  #gate button:hover { background: #a80d26; }
  #gate .err { color: #c8102e; font-size: 13px; margin-top: 12px; min-height: 18px; }
  #viewer { display: none; height: 100vh; }
  #viewer iframe { width: 100%; height: 100%; border: none; display: block; }
  #logout { position: fixed; top: 8px; right: 8px; z-index: 9999; background: rgba(28,40,65,0.85); color: #fff; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; font-family: inherit; }
  #logout:hover { background: #c8102e; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">TV4</div>
    <h1>Livetider</h1>
    <p>Ange lösenord för att se sändningstiderna.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Lösenord" autofocus autocomplete="current-password">
      <button type="submit">Logga in</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>

<div id="viewer">
  <button id="logout" title="Logga ut">Logga ut</button>
  <iframe id="frame" title="TV4 Livetider"></iframe>
</div>

<script>
  const EXPECTED_HASH = 'f7ae0dd634640d9fca7a4945297106005ad5c998cc6ef72ba99c432aaadabb0b';
  const STORAGE_KEY = 'tv4-livetider-auth';
  const CONTENT_URL = 'Livetider.html';

  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function showViewer() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('viewer').style.display = 'block';
    document.getElementById('frame').src = CONTENT_URL + '?t=' + Date.now();
  }

  function showGate() {
    document.getElementById('viewer').style.display = 'none';
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }

  if (sessionStorage.getItem(STORAGE_KEY) === EXPECTED_HASH) {
    showViewer();
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent = '';
    const h = await sha256(pw);
    if (h === EXPECTED_HASH) {
      sessionStorage.setItem(STORAGE_KEY, h);
      showViewer();
    } else {
      err.textContent = 'Fel lösenord, försök igen.';
      document.getElementById('pw').select();
    }
  });

  document.getElementById('logout').addEventListener('click', () => {
    sessionStorage.removeItem(STORAGE_KEY);
    showGate();
  });
</script>

</body>
</html>
